name: windows-release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m riffle.make_icon
      - run: python -m unittest discover -s tests
      # 태그에서 버전을 한 번만 정하고, 앱과 설치 파일이 그 값을 같이 쓴다.
      - name: Stamp version
        shell: pwsh
        run: |
          $version = python -m riffle.stamp_version "${{ github.ref_name }}"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: pyinstaller --noconfirm Riffle.spec
      - run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" "installer\Riffle.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: Riffle-Windows
          path: release/*.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.exe
          generate_release_notes: true

  # 웹(Render 서비스 riffle)은 release 가지를 따라 배포된다. 개발 중 커밋이 배포되지 않도록
  # 릴리스 태그에서만 그 가지를 옮기고, 이미지 안에는 깃이 없으니 버전을 새긴 파일을 함께 싣는다.
  web:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m riffle.stamp_version "${{ github.ref_name }}"
      - name: Publish the release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force riffle/_version.py
          git commit --message "Riffle ${GITHUB_REF_NAME#v} 웹 배포"
          git push --force origin HEAD:release
